name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: write

env:
  GO_VERSION: '1.26.x'
  PLUGIN_ID: local-queue
  REPOSITORY: timonwong/cpa-plugin-local-queue

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$EVENT_TAG}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid release tag: $tag" >&2; exit 1; }
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not based on main" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            ext: so
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            ext: so
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            ext: dylib
          - os: macos-14
            goos: darwin
            goarch: arm64
            ext: dylib
          - os: windows-2022
            goos: windows
            goarch: amd64
            ext: dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          out="${PLUGIN_ID}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "$out"
          CGO_ENABLED=1 go build -buildmode=c-shared -ldflags "-X main.pluginVersion=${VERSION}" -o "$out/${PLUGIN_ID}.${{ matrix.ext }}" .
          zip -j "${out}.zip" "$out/${PLUGIN_ID}.${{ matrix.ext }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${out}.zip" > "${out}.zip.sha256"
          else
            shasum -a 256 "${out}.zip" > "${out}.zip.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            local-queue_*.zip
            local-queue_*.zip.sha256
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cat dist/*.zip.sha256 > dist/checksums.txt
          if ! gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPOSITORY" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --repo "$REPOSITORY" --clobber

  store:
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Update plugin store snapshot
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git ls-remote --exit-code --heads origin plugin-store-release >/dev/null 2>&1; then
            git fetch origin plugin-store-release
            git switch --track -c plugin-store-release origin/plugin-store-release
          else
            git switch --orphan plugin-store-release
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cat > registry.json <<EOF
          {
            "schema_version": 1,
            "plugins": [
              {
                "id": "local-queue",
                "name": "CPA Local Queue",
                "description": "Credential-level FIFO admission plugin for CLIProxyAPI.",
                "author": "timonwong",
                "version": "${VERSION}",
                "repository": "https://github.com/${REPOSITORY}",
                "install": {"type": "github-release"}
              }
            ]
          }
          EOF
          jq -e --arg version "$VERSION" '.schema_version == 1 and (.plugins | length == 1) and .plugins[0].id == "local-queue" and .plugins[0].version == $version' registry.json >/dev/null
          if ! git diff --quiet -- registry.json || ! git ls-files --error-unmatch registry.json >/dev/null 2>&1; then
            git add registry.json
            git commit -m "chore: publish local-queue ${TAG} to plugin store"
            git push origin HEAD:plugin-store-release
          fi
          store_tag="plugin-store-release/${TAG}"
          if git ls-remote --exit-code --tags origin "refs/tags/${store_tag}" >/dev/null 2>&1; then
            echo "store tag already exists: ${store_tag}"
          else
            git tag -a "$store_tag" -m "Plugin store snapshot ${TAG}"
            git push origin "$store_tag"
          fi
